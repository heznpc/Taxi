name: Build Signed Taxi Candidate

# Runs from an immutable public version tag before npm publish or GitHub Release
# creation. It produces and verifies a Developer-ID-signed, notarized, stapled
# Taxi.app, then encrypts the zip and machine-readable receipt into a
# confidential Actions artifact. cd.yml must explicitly consume that exact run
# and receipt.
#
# Required GitHub secrets (store them in the `release` environment only after
# its reviewer, no-admin-bypass, and tag-only rules pass the source gate):
#   APPLE_DEVELOPER_ID          Common name of the Developer ID
#                               Application certificate, e.g.
#                               "Developer ID Application: Heznpc (TEAMID)"
#   APPLE_API_KEY_P8_BASE64     App Store Connect API private key, base64-encoded
#   APPLE_API_KEY_ID            App Store Connect API key ID
#   APPLE_API_ISSUER_ID         App Store Connect API issuer UUID
#   APPLE_TEAM_ID               10-character team identifier
#   APPLE_CERT_P12_BASE64       Developer ID Application cert + private
#                               key exported as .p12, base64-encoded
#                               (base64 -i cert.p12 | pbcopy)
#   APPLE_CERT_P12_PASSWORD     Password for the .p12 import
#   TAXI_APP_PROVISIONING_PROFILE_BASE64
#                               Developer ID profile for app.taxi, base64-encoded
#   TAXI_WIDGET_PROVISIONING_PROFILE_BASE64
#                               Developer ID profile for app.taxi.Widget,
#                               base64-encoded (must not reuse the app profile)
#   TAXI_RELEASE_CANDIDATE_KEY_BASE64
#                               Shared 32-byte candidate encryption key
#                               (`openssl rand -base64 32`). Store the same value
#                               in both the `release` and `npm` environments.
#
# Missing credentials, missing environment protection, and any verification
# failure are hard failures. There is no unsigned or skipped success path.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be v?MAJOR.MINOR.PATCH with no leading zeroes"
            exit 1
          fi
          VERSION="${REQUESTED_TAG#v}"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::Signed candidates must be invoked from refs/tags/$TAG (got type=$GITHUB_REF_TYPE ref=$GITHUB_REF)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved immutable release tag: $TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/verify-release-environment.mjs --repo="${{ github.repository }}" --tag="$RELEASE_TAG"

      - name: Verify immutable release source identity
        id: identity
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Checked-out HEAD $HEAD_SHA does not match $RELEASE_TAG commit $TAG_SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::Release tag is not reachable from origin/main"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::$RELEASE_TAG requests $EXPECTED_VERSION but package.json is $PACKAGE_VERSION"
            exit 1
          fi
          BUNDLE_SOURCE_VERSION="$(sed -nE 's/.*CFBundleShortVersionString string ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' scripts/bundle-app.sh)"
          WIDGET_SOURCE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/widget/Info.plist)"
          if [ "$BUNDLE_SOURCE_VERSION" != "$EXPECTED_VERSION" ] || [ "$WIDGET_SOURCE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Source bundle versions must match $EXPECTED_VERSION (app=$BUNDLE_SOURCE_VERSION widget=$WIDGET_SOURCE_VERSION)"
            exit 1
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Release source verified: $RELEASE_TAG -> $HEAD_SHA -> package/app/widget $EXPECTED_VERSION"

  release-app:
    needs: resolve-release
    runs-on: macos-latest
    environment: release
    permissions:
      actions: read
      contents: read
    env:
      # Signed distribution includes the widget; the protected lane must never
      # accept the faster widget-skipping local default.
      TAXI_REQUIRE_WIDGET: "1"
      TAXI_SIGNED_SOAK_DURATION_SECONDS: "3600"
      TAXI_SIGNED_ALLOW_SHORT_SOAK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve-release.outputs.tag }}
          fetch-depth: 0

      # Re-query immediately after the environment gate too. This closes the
      # interval between source resolution and approval without reading any
      # Apple secret in the check itself.
      - name: Re-verify release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: node scripts/verify-release-environment.mjs --repo="${{ github.repository }}" --tag="$RELEASE_TAG"

      # This check runs only after the protected `release` environment gate.
      # Every missing value is fatal: a green run must always contain a fully
      # verified signed candidate and receipt.
      - name: Preflight — required secrets present
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          TAXI_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.TAXI_APP_PROVISIONING_PROFILE_BASE64 }}
          TAXI_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.TAXI_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          TAXI_RELEASE_CANDIDATE_KEY_BASE64: ${{ secrets.TAXI_RELEASE_CANDIDATE_KEY_BASE64 }}
        run: |
          missing=()
          [ -n "$APPLE_DEVELOPER_ID" ]      || missing+=("APPLE_DEVELOPER_ID")
          [ -n "$APPLE_API_KEY_P8_BASE64" ] || missing+=("APPLE_API_KEY_P8_BASE64")
          [ -n "$APPLE_API_KEY_ID" ]         || missing+=("APPLE_API_KEY_ID")
          [ -n "$APPLE_API_ISSUER_ID" ]      || missing+=("APPLE_API_ISSUER_ID")
          [ -n "$APPLE_TEAM_ID" ]           || missing+=("APPLE_TEAM_ID")
          [ -n "$APPLE_CERT_P12_BASE64" ]   || missing+=("APPLE_CERT_P12_BASE64")
          [ -n "$APPLE_CERT_P12_PASSWORD" ] || missing+=("APPLE_CERT_P12_PASSWORD")
          [ -n "$TAXI_APP_PROVISIONING_PROFILE_BASE64" ] || missing+=("TAXI_APP_PROVISIONING_PROFILE_BASE64")
          [ -n "$TAXI_WIDGET_PROVISIONING_PROFILE_BASE64" ] || missing+=("TAXI_WIDGET_PROVISIONING_PROFILE_BASE64")
          [ -n "$TAXI_RELEASE_CANDIDATE_KEY_BASE64" ] || missing+=("TAXI_RELEASE_CANDIDATE_KEY_BASE64")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "See .github/workflows/release-app.yml header for the full list"
            exit 1
          fi

      - name: Verify protected release checkout
        env:
          EXPECTED_SHA: ${{ needs.resolve-release.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.resolve-release.outputs.version }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$EXPECTED_SHA" ] || [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Release tag moved or checkout drifted (expected=$EXPECTED_SHA tag=$TAG_SHA HEAD=$HEAD_SHA)"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::$RELEASE_TAG requests $EXPECTED_VERSION but package.json is $PACKAGE_VERSION"
            exit 1
          fi
          echo "Protected release checkout verified: $RELEASE_TAG -> $HEAD_SHA -> package $EXPECTED_VERSION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: "npm"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install dependencies
        run: npm ci

      # Validate the npm and MCPB surfaces before importing signing material.
      # The production app runtime gate runs later against the exact signed,
      # notarized and stapled artifact inside notarize-app.sh.
      - name: Release preflight (npm + MCPB)
        run: npm run release:preflight

      - name: Build .app bundle (ad-hoc signed baseline)
        run: bash scripts/bundle-app.sh

      - name: Verify release bundle identity
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Taxi.app/Contents/Info.plist)"
          WIDGET_PLIST="Taxi.app/Contents/PlugIns/TaxiWidget.appex/Contents/Info.plist"
          if [ ! -f "$WIDGET_PLIST" ]; then
            echo "::error::Signed release requires TaxiWidget.appex"
            exit 1
          fi
          WIDGET_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WIDGET_PLIST")"
          if [ "$APP_VERSION" != "$EXPECTED_VERSION" ] || [ "$WIDGET_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Built app/widget versions must match $EXPECTED_VERSION (app=$APP_VERSION widget=$WIDGET_VERSION)"
            exit 1
          fi

      # Import the Developer ID certificate into a throwaway keychain only
      # after source/package checks and the exact ad-hoc bundle identity pass.
      # The keychain is discarded with the ephemeral runner.
      - name: Import signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN=build.keychain
          KEYCHAIN_PW="$(uuidgen)"
          if ! security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null 2>&1 ||
             ! security default-keychain -s "$KEYCHAIN" >/dev/null 2>&1 ||
             ! security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null 2>&1 ||
             ! security set-keychain-settings -t 3600 -u "$KEYCHAIN" >/dev/null 2>&1; then
            echo "::error::Ephemeral signing keychain setup failed"
            exit 1
          fi

          trap 'rm -f cert.p12' EXIT
          if ! printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > cert.p12 2>/dev/null; then
            echo "::error::Signing certificate decoding failed"
            exit 1
          fi
          if ! security import cert.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null 2>&1; then
            rm -f cert.p12
            echo "::error::Signing certificate import failed"
            exit 1
          fi
          rm -f cert.p12

          # Let codesign run non-interactively against this keychain.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null 2>&1 || {
              echo "::error::Signing key access setup failed"
              exit 1
            }

      - name: Verify public signing identity
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAXI_SIGNING_KEYCHAIN: build.keychain
        run: bash scripts/verify-signing-identity.sh

      - name: Sign + notarize + staple + verify exact artifact
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAXI_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.TAXI_APP_PROVISIONING_PROFILE_BASE64 }}
          TAXI_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.TAXI_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          TAXI_SIGNING_KEYCHAIN: build.keychain
        run: |
          umask 077
          SIGNING_SECRET_DIR="$(mktemp -d "$RUNNER_TEMP/taxi-signing.XXXXXX")"
          API_KEY_PATH="$SIGNING_SECRET_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          APP_PROFILE_PATH="$SIGNING_SECRET_DIR/Taxi.provisionprofile"
          WIDGET_PROFILE_PATH="$SIGNING_SECRET_DIR/TaxiWidget.provisionprofile"
          VERIFICATION_EVIDENCE="$RUNNER_TEMP/signed-app-verification.json"
          trap 'rm -f "$API_KEY_PATH" "$APP_PROFILE_PATH" "$WIDGET_PROFILE_PATH"; rmdir "$SIGNING_SECRET_DIR" 2>/dev/null || true' EXIT
          rm -f "$VERIFICATION_EVIDENCE"
          if ! printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH" 2>/dev/null; then
            echo "::error::App Store Connect API key decoding failed"
            exit 1
          fi
          if ! printf '%s' "$TAXI_APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH" 2>/dev/null; then
            echo "::error::Taxi app provisioning profile decoding failed"
            exit 1
          fi
          if ! printf '%s' "$TAXI_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE_PATH" 2>/dev/null; then
            echo "::error::Taxi widget provisioning profile decoding failed"
            exit 1
          fi
          chmod 0600 "$API_KEY_PATH" "$APP_PROFILE_PATH" "$WIDGET_PROFILE_PATH"
          APPLE_API_KEY_PATH="$API_KEY_PATH" \
            TAXI_APP_PROVISIONING_PROFILE_PATH="$APP_PROFILE_PATH" \
            TAXI_WIDGET_PROVISIONING_PROFILE_PATH="$WIDGET_PROFILE_PATH" \
            TAXI_SIGNED_VERIFICATION_OUTPUT="$VERIFICATION_EVIDENCE" \
            bash scripts/notarize-app.sh

      # Inspect the distribution bundle itself, not only package-lock.json.
      # This catches a missing embedded Node license, project/provenance notice,
      # or production node_modules license before the final archive is created.
      - name: Verify signed app license surface
        run: npm run licenses:check -- --app Taxi.app

      - name: Package signed .app for release
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          rm -f "Taxi-${VERSION}.zip"
          ditto -c -k --norsrc --keepParent Taxi.app "Taxi-${VERSION}.zip"
          ls -la "Taxi-${VERSION}.zip"

      - name: Create signed release receipt
        id: receipt
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
        run: |
          node scripts/create-signed-release-receipt.mjs \
            --archive="Taxi-${VERSION}.zip" \
            --output=signed-release-receipt.json \
            --repository="${GITHUB_REPOSITORY}" \
            --run-id="${GITHUB_RUN_ID}" \
            --run-attempt="${GITHUB_RUN_ATTEMPT}" \
            --event="${GITHUB_EVENT_NAME}" \
            --ref="${GITHUB_REF}" \
            --ref-type="${GITHUB_REF_TYPE}" \
            --head-sha="$RELEASE_SHA" \
            --tag="$RELEASE_TAG" \
            --version="$VERSION" \
            --verification-evidence="$RUNNER_TEMP/signed-app-verification.json"

      # Public-repository Actions artifacts are readable repository resources.
      # Seal both payloads so the pre-publication candidate remains confidential
      # until the protected npm environment decrypts it for cd.yml.
      - name: Encrypt signed release candidate
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
          TAXI_RELEASE_CANDIDATE_KEY_BASE64: ${{ secrets.TAXI_RELEASE_CANDIDATE_KEY_BASE64 }}
        run: |
          node scripts/signed-release-receipt-crypto.mjs encrypt \
            --input="Taxi-${VERSION}.zip" \
            --output="Taxi-${VERSION}.zip.enc"
          node scripts/signed-release-receipt-crypto.mjs encrypt \
            --input=signed-release-receipt.json \
            --output=signed-release-receipt.json.enc
          rm -f "Taxi-${VERSION}.zip" signed-release-receipt.json

      # Do not create or mutate a GitHub Release here. Only authenticated
      # ciphertext stays in Actions until cd.yml validates and publishes it.
      - name: Upload encrypted signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taxi-signed-candidate-${{ github.run_id }}
          path: |
            Taxi-${{ needs.resolve-release.outputs.version }}.zip.enc
            signed-release-receipt.json.enc
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      # Only call the candidate available after upload succeeded. Verification,
      # receipt creation, and artifact storage remain distinct workflow states.
      - name: Record signed candidate handoff
        env:
          RECEIPT_SHA256: ${{ steps.receipt.outputs.receipt_sha256 }}
          ARCHIVE_SHA256: ${{ steps.receipt.outputs.archive_sha256 }}
        run: |
          {
            echo "### Signed Taxi candidate verified and stored"
            echo
            echo "- Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Receipt SHA-256: \`${RECEIPT_SHA256}\`"
            echo "- Archive SHA-256: \`${ARCHIVE_SHA256}\`"
            echo
            echo "No npm package or GitHub Release has been created."
          } >> "$GITHUB_STEP_SUMMARY"
